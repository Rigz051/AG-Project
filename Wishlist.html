
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <header class="navbar">
    <a href="Saved Searches & Alerts.html" class="logo">ShopEase</a>
    <nav>
      <a href="Saved Searches & Alerts.html">Saved Searches</a>
      <a href="Wishlist.html" class="active">Wishlist ♡</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">YOUR PERSONAL COLLECTION</p>
        <h1>My Wishlist <span class="heart">♥</span></h1>
        <p>All your favorite products in one place.</p>
      </div>
      <div class="cart-counter">
        🛒 Cart: <strong id="cartCount">0</strong>
      </div>
    </section>

    <section class="wishlist-toolbar">
      <div>
        <h2>Favorite Products</h2>
        <p><span id="wishlistCount">4</span> items saved for later</p>
      </div>

      <select id="sortProducts">
        <option value="default">Recently Added</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </section>

    <div id="wishlistGrid" class="product-grid"></div>
    <div id="toast" class="toast"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
